# FileMaker Sync Configuration
# Updated: 2025-06-16T14:54:06.301633

[database.source]
dsn = "rat"
user = "train"
pwd = ""
host = "127.0.0.1"
port = ""
type = "odbc"
name = ["fmp", "FileMaker Pro"]
schema = ["FileMaker_Tables", "FileMaker_Fields", "FileMaker_BaseTableFields"]

[database.target]
dt = "%Y%m%d %H:%M:%S"
type = "url"
schema = ["rat_migration", "rat"]
mig_schema = 0
tgt_schema = 1
# Fallback audit username (looked up/created in rat_migration.users) when --user-id
# isn't passed. Shared across profiles -- it identifies who ran the migration, not
# which DB they hit. Not to be confused with a profile's connection `user` below.
default_migration_user = "migration_user"
# Which [database.target.<name>] profile is active by default. CLI --target-profile
# or env RAT_TARGET_PROFILE override this (see scripts/env_secrets.py resolve_secret).
active_profile = "oci"

[database.target.supabase]
# Existing Supabase.com cloud project.
name = ["supabase", "Supabase Cloud"]
host = "aws-0-eu-central-1.pooler.supabase.com"
dbname = "postgres"
user = "postgres.kmoehqdowgdupzdxtbei"
pwd = "Ref .env: RAT_TARGET_PWD (legacy) or RAT_TARGET_PWD_SUPABASE"
port = "5432"

[database.target.oci]
# Self-hosted Supabase on OCI, reached over Tailscale.
name = ["oci", "Self-hosted Supabase (OCI/Tailscale)"]
host = "huey.taila2eeb2.ts.net"
dbname = "postgres"
# Supavisor tenant 'default' -- self-hosted convention, not the cloud's
# postgres.<project-ref> form.
user = "postgres.default"
pwd = "Ref .env: RAT_TARGET_PWD_OCI"
port = "5432"

[export]
path = "/dev/RAT_Trains_Project/Migration/exports"
prefix = "rat"
image_formats_supported = ['jpg', 'webp']
image_path = "images"

[storage]
# oci's Supabase Storage -- where exported images get uploaded (scripts/upload_images_oci.py,
# scripts/migrate_storage_images_from_cloud.py) and where db_dml_loader.py's
# picture_metadata.file_location URLs point. Secret-free (the service_role key needed to
# write here is RAT_OCI_SERVICE_KEY in .env, never here -- see scripts/env_secrets.py).
public_url = "https://huey.taila2eeb2.ts.net"
bucket = "picaloco"
allowed_mime_types = ["image/webp"]
file_size_limit = 900000

[debug]
log_level = "DEBUG"
console_logging = true
max_log_entries = 1000
debug_mode = true
verbose_sql = true
debug_connections = true
